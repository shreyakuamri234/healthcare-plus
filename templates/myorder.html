{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Healthcare+</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body { background:#eef3f9; font-family: Arial, sans-serif; }
        .navbar-custom { background:white; padding:16px 45px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .logo { font-size:30px; font-weight:bold; color:#1e293b; text-decoration: none; }
        .logo span { color:#2563eb; }
        .main-wrapper { max-width:1250px; margin:auto; padding:40px 20px; }
        .order-layout { display:grid; grid-template-columns:1.4fr 1fr; gap:30px; }
        .form-box, .summary-box { background:white; padding:30px; border-radius:20px; box-shadow:0 4px 18px rgba(0,0,0,0.05); }
        .form-control, .form-select { height:50px; border-radius:10px; margin-bottom:18px; }
        .payment-btn { width:100%; background:#2563eb; color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; }
        
        /* Product Card */
        .product-card { background:#f8fbff; border:1px solid #e5edf7; border-radius:15px; padding:18px; margin-bottom:18px; position: relative; }
        
        /* Original Remove Button style */
        .remove-btn { background:#ef4444; color:white; border:none; padding:5px 12px; border-radius:8px; font-size:12px; cursor: pointer; }
        .remove-btn:hover { background:#dc2626; }

        /* Small Quantity Controls */
        .qty-wrapper { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .sm-qty-btn { 
            width: 26px; height: 26px; border-radius: 4px; border: 1px solid #2563eb; 
            background: white; color: #2563eb; font-size: 14px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .sm-qty-btn:hover { background: #2563eb; color: white; }
        .qty-text { font-size: 14px; font-weight: bold; min-width: 15px; text-align: center; }

        .total-section { border-top:2px dashed #dbe2ea; margin-top:20px; padding-top:20px; }
        .grand-total { font-size:24px; font-weight:bold; color:#2563eb; }

        @media(max-width:900px) { .order-layout { grid-template-columns:1fr; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand logo" href="/">Healthcare<span>+</span></a>
    </div>
</nav>

<div class="main-wrapper">
    <h2 class="mb-4">📦 Place Your Order</h2>

    <div class="order-layout">
        <!-- LEFT: CUSTOMER FORM -->
        <div class="form-box">
            <form id="orderForm">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" id="custName" class="form-control" placeholder="Enter your name" required>

                <label class="form-label fw-bold">Phone Number</label>
                <input type="number" id="custPhone" class="form-control" placeholder="Enter mobile number" required>

                <label class="form-label fw-bold">Delivery Address</label>
                <textarea id="custAddress" class="form-control" placeholder="Full address..." style="height: 100px;" required></textarea>

                <label class="form-label fw-bold">Payment Method</label>
                <select id="payMethod" class="form-select">
                    <option value="Online">Online Payment</option>
                    <option value="COD">Cash on Delivery</option>
                    <option value="UPI">UPI Payment</option>
                </select>

                <button type="button" class="payment-btn" onclick="placeOrder()">Proceed to Payment</button>
            </form>
        </div>

        <!-- RIGHT: ORDER SUMMARY -->
        <div class="summary-box">
            <h3 class="mb-4">🛒 Order Summary</h3>
            <div id="cartItems">
                <!-- Data will load here -->
            </div>

            <div class="total-section">
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Delivery</span>
                    <span style="color:green;">FREE</span>
                </div>
                <div class="d-flex justify-content-between grand-total">
                    <span>Total</span>
                    <span id="grandTotal">₹0</span>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Pehle Razorpay ki library load karein -->
     <!-- Ye line sabse zaroori hai -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    // 1. Sabse pehle placeOrder function ko upar rakh dete hain taaki yeh pehle load ho jaye
    async function placeOrder() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const address = document.getElementById('custAddress').value;
        const amount = document.getElementById('grandTotal').innerText.replace('₹', ''); 

        if (!name || !phone || !address) { 
            alert("Please fill details."); 
            return; 
        }
        if (cart.length === 0) { 
            alert("Cart is empty!"); 
            return; 
        }

        try {
            const response = await fetch('/initiate-payment/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, phone, address, amount })
            });

            const orderData = await response.json();

            if (orderData.status === "error") {
                alert("Error: " + orderData.message);
                return;
            }
console.log("Current Order ID:", orderData.id);
console.log("Current Amount:", orderData.amount);
            
const options = {
    "key": "rzp_test_SknKwzX098VXi6", 
    "amount": orderData.amount,
    "currency": "INR",
    "name": "Healthcare+",
    "description": "Medicine Order",
    "order_id": orderData.id,
    
    "redirect": true,
    "callback_url": window.location.origin + "/order-success/",

    "modal": {
        "backdropclose": false,
        "escape": false,
        "handleback": false
    },

    "handler": function (razorpayResponse) {
        console.log("Payment completed inside Razorpay window!");
        
        // 1. Django backend par submit karne ke liye form ready karein
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/order-success/'; 

        const csrfToken = '{{ csrf_token }}';

        const fields = {
            'razorpay_payment_id': razorpayResponse.razorpay_payment_id,
            'razorpay_order_id': razorpayResponse.razorpay_order_id,
            'razorpay_signature': razorpayResponse.razorpay_signature,
            'csrfmiddlewaretoken': csrfToken
        };

        for (const key in fields) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }

        document.body.appendChild(form);

        // 🔴 YAHAN RUKTI HAI SCREEN: 3 second tak green animation dikhega, fir automatic redirect hoga
        setTimeout(function() {
            form.submit();
        }, 3000); 
    },
    "prefill": { 
        "name": typeof name !== 'undefined' ? name : "Test User", 
        "contact": typeof phone !== 'undefined' ? phone : "9999999999" 
    },
    "theme": { 
        "color": "#2563eb" 
    }
};

var rzp1 = new Razorpay(options);
rzp1.open();

        } catch (error) {
            console.error("Error:", error);
            alert("Connection error. Check terminal.");
        }
    }

    // 2. Baki ka cart management code niche
    let cart = JSON.parse(localStorage.getItem('userCart')) || [];

    function renderOrderSummary() {
        const cartContainer = document.getElementById('cartItems');
        if (cart.length === 0) {
            cartContainer.innerHTML = `<p class="text-muted text-center">Your cart is empty!</p>`;
            updateTotals();
            return;
        }
        cartContainer.innerHTML = cart.map((item, index) => {
            const itemQty = item.quantity || 1;
            return `
            <div class="product-card">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h5 class="mb-1" style="font-size: 17px;">${item.name}</h5>
                        <div class="fw-bold mt-1 text-primary">₹${item.price * itemQty}</div>
                        <div class="qty-wrapper">
                            <button type="button" class="sm-qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span class="qty-text">${itemQty}</span>
                            <button type="button" class="sm-qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <button type="button" class="remove-btn" onclick="removeItem(${index})"><i class="fa fa-trash"></i></button>
                </div>
            </div>`;
        }).join('');
        updateTotals();
    }

    function updateQty(index, change) {
        let newQty = (cart[index].quantity || 1) + change;
        if (newQty > 0) { 
            cart[index].quantity = newQty; 
            localStorage.setItem('userCart', JSON.stringify(cart)); 
            renderOrderSummary(); 
        } else { 
            removeItem(index); 
        }
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('userCart', JSON.stringify(cart));
        renderOrderSummary();
    }

    function updateTotals() {
        let total = cart.reduce((sum, item) => sum + (parseFloat(item.price) * (item.quantity || 1)), 0);
        document.getElementById('subtotal').innerText = `₹${total}`;
        document.getElementById('grandTotal').innerText = `₹${total}`;
    }

    window.onload = renderOrderSummary;
</script>

</body>
</html>
