<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Successful</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .success-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #e6f7ed;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .icon-container svg {
            width: 45px;
            height: 45px;
            fill: #22c55e;
        }

        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .details-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            margin-bottom: 30px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #9ca3af;
            font-weight: 500;
        }

        .value {
            color: #374151;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: transparent;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <!-- Success Green Tick Icon -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>

        <h1>Appointment Booked!</h1>
        <p class="subtitle">Aapka appointment successfully confirm ho gaya hai. Details niche di gayi hain.</p>

        <!-- Appointment Details -->
        <div class="details-box">
            <div class="detail-row">
                <span class="label">Booking ID:</span>
                <span class="value">#APT-98241</span>
            </div>
            <div class="detail-row">
                <span class="label">Date:</span>
                <span class="value">15 June, 2026</span>
            </div>
            <div class="detail-row">
                <span class="label">Time:</span>
                <span class="value">11:30 AM</span>
            </div>
            <div class="detail-row">
                <span class="label">Doctor/Expert:</span>
                <span class="value">Dr. Anjali Sharma</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
            <a href="#" class="btn btn-primary">Go to Dashboard</a>
            <a href="#" class="btn btn-secondary">Download Receipt</a>
        </div>
    </div>

</body>
</html>
