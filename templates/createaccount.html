{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare+ | Register</title>
     <link rel="stylesheet" href="{% static 'create.css' %}">
</head>
<body>

<div class="reg-container">
    <div class="logo">Healthcare<span>+</span></div>
    <h2>Create Account</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Join us for exclusive health benefits.</p>

    <form>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password">
        </div>
        <button type="submit" class="btn-reg">Create Account</button>
    </form>

    <div class="footer-links">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

</body>
</html>
